<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>Project LORA — оверлей для стріму</title>
<style>
/* Прозорий оверлей для OBS: Джерело «Браузер» → локальний файл overlay.html, ширина 1920, висота 1080. */
html,body{margin:0;background:transparent;font:600 20px system-ui,sans-serif;color:#fff;overflow:hidden}
#state{position:absolute;left:24px;top:20px;background:#0b1118cc;border:1px solid #2b3d50;border-radius:12px;padding:10px 16px;min-width:300px}
#state b{font-size:24px}#state .s{font-size:15px;color:#9fb6cc;font-weight:500}
#feed{position:absolute;left:24px;bottom:24px;width:720px}
.item{background:#0b1118d9;border-left:4px solid #4fb3ff;border-radius:8px;padding:8px 12px;margin-top:8px;animation:in .4s ease-out}
.item.big{border-color:#ffd34d}.item.bad{border-color:#ff5d5d}.item.war{border-color:#ff9a3d}.item.good{border-color:#4cd28a}
@keyframes in{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
</style></head><body>
<div id="state" style="display:none"></div><div id="feed"></div>
<script>
// Слухає гру (index.html відкрита в тому ж браузері/профілі) через BroadcastChannel('lora').
// Для OBS у майбутньому — WebSocket-ретранслятор (див. docs/STREAM.md).
const feed = document.getElementById('feed'), st = document.getElementById('state');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function push(text, kind) { const d = document.createElement('div'); d.className = 'item ' + (kind || ''); d.textContent = text; feed.appendChild(d); while (feed.children.length > 5) feed.removeChild(feed.firstChild); setTimeout(() => d.remove(), 15000); }
try {
  const bc = new BroadcastChannel('lora');
  bc.onmessage = e => { const m = e.data || {};
    if (m.type === 'news' && (m.data.kind === 'big' || m.data.kind === 'war' || m.data.kind === 'bad')) push(m.data.text, m.data.kind);
    if (m.type === 'state') { st.style.display = 'block'; const d = m.data; st.innerHTML = `<b>${esc(d.country)}</b> <span class="s">${esc(d.date)}</span><div class="s">ВВП $${d.gdp.toFixed(0)} млрд (${(d.growth * 100).toFixed(1)}%) · стабільність ${d.stab.toFixed(0)}${d.wars.length ? ' · ⚔ ' + esc(d.wars.join(', ')) : ''}</div>`; } };
} catch (e) { push('BroadcastChannel недоступний у цьому браузері', 'bad'); }
</script></body></html>
