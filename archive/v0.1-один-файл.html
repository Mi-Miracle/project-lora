<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Геополітика 2026 — глобальна стратегія</title>
<style>
:root{--bg:#0b1118;--panel:#121b26;--panel2:#17222f;--line:#263546;--tx:#dce6f0;--mut:#8aa0b5;--acc:#4fb3ff;--good:#4cd28a;--bad:#ff5d5d;--warn:#ffc04d;--sea:#0d1d2c}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:var(--tx);background:#1d2b3b;border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{background:#25384d;border-color:#36506b}button.pri{background:#1f5f99;border-color:#2b7fc7}button.pri:hover{background:#2671b5}
button.dang{background:#6b1f24;border-color:#943036}button.dang:hover{background:#82262c}button.on{background:#1f5f99;border-color:#4fb3ff}
button:disabled{opacity:.45;cursor:not-allowed}
select,input[type=number],input[type=text]{font:inherit;color:var(--tx);background:#0e1620;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input[type=range]{width:100%;accent-color:var(--acc)}
#map{position:absolute;inset:0;display:block;cursor:grab}
#map.drag{cursor:grabbing}
#top{position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(#121b26f2,#121b26e0);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 10px;z-index:5;white-space:nowrap;overflow-x:auto}
#top .st{display:flex;flex-direction:column;line-height:1.1}#top .st b{font-size:13px}#top .st span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid #0006}
#speed button{padding:4px 8px;margin-right:2px}
#left{position:absolute;left:0;top:46px;bottom:0;width:380px;background:#121b26f5;border-right:1px solid var(--line);z-index:4;display:flex;flex-direction:column;transition:transform .2s}
#left.hide{transform:translateX(-100%)}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 2px;font-size:12px;color:var(--mut);border-bottom:2px solid transparent}
#tabs button.on{color:var(--tx);border-bottom-color:var(--acc);background:#17222f}
#tabc{flex:1;overflow-y:auto;padding:10px 12px 80px}
#right{position:absolute;right:0;top:46px;width:340px;max-height:calc(100% - 56px);overflow-y:auto;background:#121b26f5;border-left:1px solid var(--line);border-bottom:1px solid var(--line);border-bottom-left-radius:8px;z-index:4;padding:10px 12px;display:none}
#news{position:absolute;left:390px;bottom:10px;width:min(520px,calc(100% - 760px));min-width:300px;max-height:170px;overflow-y:auto;background:#0e1620e8;border:1px solid var(--line);border-radius:8px;z-index:3;padding:6px 8px;font-size:12px}
#left.hide~#news{left:10px}
#news div{padding:2px 0;border-bottom:1px solid #1a2633}#news .d{color:var(--mut);font-size:10px;margin-right:6px}
#news .big{color:#fff;font-weight:600}#news .bad{color:#ffb3b3}#news .good{color:#a8f0c6}#news .war{color:#ffd28a}#news .me{background:#1f5f9926}
#legend{position:absolute;right:10px;bottom:10px;z-index:3;background:#0e1620e8;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;max-width:300px}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:54px;background:#1f5f99;color:#fff;padding:6px 12px;border-radius:20px;z-index:6;font-size:12px;display:none;pointer-events:none}
#tip{position:absolute;pointer-events:none;background:#0b1118f2;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;z-index:7;display:none;max-width:280px}
h3{margin:12px 0 6px;font-size:13px;color:#fff;text-transform:uppercase;letter-spacing:.05em}h3:first-child{margin-top:2px}
h2{margin:0 0 4px;font-size:17px}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.row span:first-child{color:var(--mut)}
.mut{color:var(--mut)}.g{color:var(--good)}.r{color:var(--bad)}.y{color:var(--warn)}.small{font-size:11px}
.bar{height:6px;background:#0b1118;border-radius:3px;overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 4px;border-bottom:1px solid #1d2a38;text-align:right}th{color:var(--mut);font-weight:500;font-size:11px}td:first-child,th:first-child{text-align:left}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sl{margin:8px 0}.sl .lab{display:flex;justify-content:space-between}.sl .lab b{color:#fff}
.tag{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;background:#263546;margin:1px 2px 1px 0}
.tag.war{background:#6b1f24}.tag.al{background:#1f4f7a}.tag.nk{background:#5a4a12}
#modal{position:absolute;inset:0;background:#000a;z-index:20;display:none;align-items:center;justify-content:center}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-width:560px;width:calc(100% - 30px);max-height:90%;overflow-y:auto}
#start{position:absolute;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 30%,#14273b,#070b10 70%);display:flex;align-items:center;justify-content:center}
#start .box{width:min(920px,calc(100% - 24px));max-height:94%;overflow:auto;background:#121b26ee;border:1px solid var(--line);border-radius:14px;padding:22px}
#start h1{margin:0;font-size:28px;letter-spacing:.02em}#start .sub{color:var(--mut);margin:4px 0 14px}
#clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;max-height:330px;overflow-y:auto;margin-top:8px}
#clist .c{background:#17222f;border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}#clist .c:hover{border-color:#36506b}#clist .c.sel{border-color:var(--acc);background:#1a2f45}
#clist .c b{display:block}#clist .c span{font-size:11px;color:var(--mut)}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0 4px;font-size:12px;color:#b8c7d6}
.feat div{background:#0e1620;border:1px solid var(--line);border-radius:8px;padding:8px}
#togL{position:absolute;left:8px;bottom:10px;z-index:5;display:none}
@media (max-width:900px){#left{width:min(380px,92%)}#right{width:min(340px,92%)}#news{left:10px;width:calc(100% - 20px);max-height:110px;bottom:10px}#legend{display:none}}
</style>
</head>

  <div class="row"><span>Кораблі</span><b>${f.s.toFixed(0)}</b></div><div class="row"><span>Організованість</span><span>${pct(f.org, 0)}</span></div><div class="row"><span>Якість</span><span>${n.navQ.toFixed(2)}</span></div>
  ${f.mv ? `<div class="row"><span>Рух</span><span>→ ${esc(D.S[f.mv.nodes[f.mv.nodes.length - 1]][1])}</span></div>` : ''}
  ${mine ? `<div class="card small">ПКМ по морю — перемістити. Флот у вузлі блокує ворожу торгівлю через нього та захищає ваші маршрути.</div><div class="btns"><button onclick="orderMode='fleet';hint('Клікніть точку в морі')">⛵ Рух…</button><button onclick="fleetAct('home')">🏠 На базу</button><button class="${f.auto ? 'on' : ''}" onclick="fleetAct('auto')">🤖 Авто ${f.auto ? 'увімк.' : 'вимк.'}</button></div>` : ''}`;
}
function fleetAct(k) { const f = G.fleets.find(x => x.id === sel.id); if (!f) return; if (k === 'home') { const p = D.T[nat(f.n).home].p[0]; if (p) G.orderFleet(f, p[0]); } if (k === 'auto') f.auto = !f.auto; renderRight(); }

// ---------- news ----------
function renderNews() {
  const P = G.player; const mineOnly = window._newsMine;
  const list = G.news.filter(x => !mineOnly || x.nats.includes(P) || x.kind === 'big').slice(0, 60);
  $('#news').innerHTML = `<div style="display:flex;justify-content:space-between;border:0"><b>Стрічка новин</b><label class="small mut"><input type="checkbox" ${mineOnly ? 'checked' : ''} onchange="window._newsMine=this.checked;renderNews()"> лише важливе для мене</label></div>` + list.map(x => `<div class="${x.kind} ${x.nats.includes(P) ? 'me' : ''}"><span class="d">${G.dateStr(x.d)}</span>${esc(x.text)}</div>`).join('');
}

// ---------- modals & popups ----------
let modalOpen = false;
function openModal(h) { $('#mbox').innerHTML = h; $('#modal').style.display = 'flex'; modalOpen = true; }
function closeModal() { $('#modal').style.display = 'none'; modalOpen = false; }
function checkPopups() {
  if (modalOpen) return;
  if (G.gameOver) { openModal(`<h2>${G.gameOver.win ? '🏆 Перемога' : '☠ Кінець гри'}</h2><p>${esc(G.gameOver.text)}</p><p class="mut">${G.dateStr()} · день ${G.day}</p><div class="btns"><button class="pri" onclick="location.reload()">Нова гра</button></div>`); return; }
  if (G.pendingPeace.length) {
    const p = G.pendingPeace[0]; const f = nat(p.from);
    let t = '';
    if (p.type === 'ally_call') t = `<h2>🛡 Союзник просить допомоги</h2><p>${esc(f.name)} зазнала нападу з боку ${esc(nat(p.vs).name)} і закликає вас виконати союзні зобов'язання.</p><p class="mut">Відмова сильно погіршить відносини з союзником.</p>`;
    else if (p.type === 'cede_to_ai') t = `<h2>📜 Ультиматум</h2><p>${esc(f.name)} пропонує мир за умови, що ви поступитеся всіма територіями, які вона контролює.</p>`;
    else if (p.type === 'cede') t = `<h2>📜 Капітуляційні умови</h2><p>${esc(f.name)} пропонує мир і готова віддати вам усі контрольовані вами території.</p>`;
    else t = `<h2>🕊 Пропозиція миру</h2><p>${esc(f.name)} пропонує білий мир: усі окуповані території повертаються власникам.</p>`;
    setSpeed(0);
    openModal(t + `<div class="btns"><button class="pri" onclick="G.act.answerPending(0,true);closeModal();renderTab(true)">Погодитись</button><button onclick="G.act.answerPending(0,false);closeModal()">Відхилити</button></div>`);
  }
}
function menu() {
  openModal(`<h2>⚙ Меню</h2><div class="btns" style="flex-direction:column;align-items:stretch">
  <button onclick="saveGame();closeModal()">💾 Зберегти гру</button><button onclick="if(loadGame())closeModal()">📂 Завантажити збереження</button>
  <button onclick="closeModal();help()">❓ Як грати</button><button class="dang" onclick="this.textContent==='Точно? Натисніть ще раз'?location.reload():this.textContent='Точно? Натисніть ще раз'">Нова гра</button><button onclick="closeModal()">Закрити</button></div>`);
}
function help() {
  openModal(`<h2>❓ Як грати</h2><div class="small" style="line-height:1.6">
  <p><b>Мета</b> — вільна пісочниця: розвивайте економіку, будуйте торгівлю й союзи, захищайтеся або розширюйтеся. Гра закінчується, якщо вашу державу знищено або уряд повалено.</p>
  <p><b>Економіка.</b> ВВП зростає залежно від багатства, інфраструктури, технологій, стабільності й забезпечення ресурсами. Податки понад 32%, великі військові видатки, мобілізація понад 1% населення, борг і санкції гальмують ріст. Дефіцит бюджету збільшує борг; надто високий борг → дефолт.</p>
  <p><b>Ресурси й торгівля.</b> 7 ресурсів: нафта, газ, зерно, метали, критичні мінерали, мікроелектроніка, промтовари. Кожна країна має реальний видобуток і потреби. Ринок щотижня розподіляє експорт до імпортерів найдешевшими маршрутами. Війна, санкції, ворожі флоти та закриті протоки розривають ланцюги — виникають дефіцити, ціни зростають, а експортери-«вигнанці» втрачають доходи.</p>
  <p><b>Логістика.</b> Маршрути йдуть суходолом і морськими шляхами через реальні вузли: Суецький і Панамський канали, Ормуз, Малакку, Босфор, Гібралтар, Баб-ель-Мандеб, Данські протоки, Північний морський шлях (лише влітку), Волго-Дон до Каспію. Газ вигідно возити трубами, зерно й руду — морем.</p>
  <p><b>Війна.</b> Армії мають чисельність, організованість, постачання та якість (техніка × технології). Оборонець має бонус. Армія, що зайшла на ворожу територію без захисників, поступово встановлює контроль (смужка прогресу). Втрата столиці та половини економіки — капітуляція. Постачання падає вглибині великих країн, без нафти та в оточенні. Морський десант потребує флоту (6 тис. бійців на корабель) і вільного моря.</p>
  <p><b>Дипломатія.</b> Союзи (НАТО, ОДКБ тощо) вступають у війну на захист членів. Агресія псує відносини з усім світом і тягне санкції. Жертви агресії отримують міжнародну допомогу.</p>
  <p><b>Керування.</b> ЛКМ — вибір; ПКМ — наказ армії/флоту; Shift+ПКМ — десант; колесо — масштаб; пробіл — пауза; 1–4 — швидкість.</p></div>
  <div class="btns"><button class="pri" onclick="closeModal()">Зрозуміло</button></div>`);
}
function saveGame() { try { localStorage.setItem('geo2026_save', G.save()); hint('💾 Гру збережено', 2000); } catch (e) { hint('⚠ Не вдалося зберегти (сховище браузера недоступне)', 3000); } }
function autosave() { try { localStorage.setItem('geo2026_auto', G.save()); } catch (e) { } }
function loadGame(key) {
  let s = null; try { s = localStorage.getItem(key || 'geo2026_save') || localStorage.getItem('geo2026_auto'); } catch (e) { }
  if (!s) { hint('Збережень не знайдено', 2500); return false; }
  const o = JSON.parse(s); G = createGame(D, { seed: Date.now() % 1e9 }); G.init(G.N[o.player].a3, 'none'); G.load(s); hookGame(); $('#start').style.display = 'none'; startUI(); return true;
}

// ---------- start screen ----------
let startSel = 'UKR', scen = 'war';
function startScreen() {
  const tmp = createGame(D, { seed: 1 }); tmp.aggregate();
  const list = tmp.N.filter(n => n.alive && n.agg.gdpPot > 0.5).sort((a, b) => b.agg.gdpPot - a.agg.gdpPot);
  window._startList = list.map(n => ({ a3: n.a3, name: n.name, gdp: n.agg.gdpPot, pop: n.agg.pop, tr: n.troopsBase, nk: n.nuke }));
  let hasSave = false; try { hasSave = !!(localStorage.getItem('geo2026_save') || localStorage.getItem('geo2026_auto')); } catch (e) { }
  $('#sbox').innerHTML = `<h1>🌍 Геополітика 2026</h1><div class="sub">Глобальна стратегія реального часу: економіка, ресурси, торгові маршрути, логістика, дипломатія та війна на мапі світу.</div>
  <div class="feat"><div>📈 <b>176 держав</b> з реальними ВВП, населенням, арміями та борговим навантаженням</div><div>🛢 <b>7 ресурсів</b> і понад 3000 торгових потоків, що реагують на війни й санкції</div><div>🚢 <b>Логістика</b>: 100 морських вузлів, канали, протоки, трубопроводи, сезонний Північний шлях</div><div>⚔ <b>Війна</b>: постачання, організованість, десанти, блокади, окупація, капітуляції</div></div>
  <h3>Сценарій</h3><div class="btns"><button id="sc_war" class="${scen === 'war' ? 'on' : ''}" onclick="scen='war';startScreen()">Світ-2026: російсько-українська війна триває</button><button id="sc_none" class="${scen === 'none' ? 'on' : ''}" onclick="scen='none';startScreen()">Мирний світ (без активних воєн)</button></div>
  <h3>Оберіть державу</h3><input type="text" id="csearch" placeholder="Пошук країни…" style="width:100%" oninput="renderClist(this.value)">
  <div id="clist"></div>
  <div class="btns" style="margin-top:14px;justify-content:space-between"><div class="btns" style="margin:0"><button class="pri" style="padding:9px 22px;font-size:15px" onclick="startGame()">▶ Почати гру</button>${hasSave ? '<button onclick="loadGame()">📂 Продовжити збереження</button>' : ''}</div><button onclick="help()">❓ Як грати</button></div>`;
  renderClist('');
}
function renderClist(q) {
  q = (q || '').toLowerCase();
  const L = window._startList.slice().sort((a, b) => (b.a3 === startSel) - (a.a3 === startSel));
  $('#clist').innerHTML = L.filter(c => !q || c.name.toLowerCase().includes(q)).map(c => `<div class="c ${c.a3 === startSel ? 'sel' : ''}" onclick="startSel='${c.a3}';renderClist(document.getElementById('csearch').value)"><b>${esc(c.name)}${c.nk ? ' ☢' : ''}</b><span>ВВП ${money(c.gdp)} · ${popM(c.pop)} · армія ${people(c.tr)}</span></div>`).join('');
}
function hookGame() { G.onNews = () => { if (!G._newsT) G._newsT = setTimeout(() => { G._newsT = 0; renderNews(); }, 300); }; }
function startGame() {
  G = createGame(D, { seed: (Date.now() % 1e9) | 0 });
  G.init(startSel, scen);
  hookGame();
  $('#start').style.display = 'none';
  startUI();
  setTimeout(help, 300);
}
function startUI() {
  const c = D.T[nat(G.player).home].c; view.s = Math.max(innerHeight / 150, 5); focusLonLat(c[0], c[1]);
  G._blkP = G.seaBlockedFor(G.player);
  renderTabs(); renderTab(true); renderTop(); renderLegend(); renderNews();
  $('#left').classList.remove('hide');
}
fitWorld();
startScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
